     černá         Pantone Process Black C                           #1d1f20 (použito)
     šedá          Pantone 425 C                                     #54585a
     bílá
   Barva školy VŠE (pro celoškolské materiály, zatím nepoužito):
     Pantone Process Blue C   C100 M0 Y0 K0   R0 G158 B224   #009ee0
     → pro školní variantu stačí nahradit --brand za #009ee0 (tmavý režim #3aa9e3)
       a --alt za tmavší zelenou nebo šedou, ať se nepere se školní modrou.
   Doplňkové barvy mimo manuál (kvůli čitelnosti grafů, ověřeno na barvoslepost):
     --alt   #0072b0 (tmavší odstín školní modré) – druhá datová řada
     --alert #d0453a – výstražná barva (např. interval nepokrývá parametr)

:root {
  /* Layout: světlé plátno, bílé panely, fakultní zelená jako jediný akcent. */
  --bg: #f4f6f5;
  --surface: #ffffff;
  --ink: #1d1f20;
  --ink-2: #54585a;
  --ink-3: #7c8183;
  --rule: #dce0df;
  --tint: #ebf0ee;
  --brand: #00957d;
  --brand-soft: #dff1ec;
  --alt: #0072b0;
  --alert: #d0453a;
  --alert-soft: #fbe4e1;
  --focus: #00957d;
  /* role v jednotlivých vizualizacích */
  --accent: var(--brand);           --accent-soft: var(--brand-soft);
  --pt-lo: #b8bdbf;                 --pt-hi: #1d1f20;      /* FWL: body podle x2 (šedá → černá) */
  --hit: var(--brand);              --miss: var(--alert);   --miss-soft: var(--alert-soft);  --truth: var(--ink);
  --plane: #8a9796;                 --vx: var(--ink-2);     --vy: var(--ink);
  --vfit: var(--brand);             --vres: var(--alt);     --vtrue: var(--ink);
  --f-display: "Lora4", Georgia, "Times New Roman", serif;
  --f-ui: "Carlito4", Calibri, "Segoe UI", system-ui, sans-serif;
  --f-math: "Mth", "Cambria Math", "STIX Two Math", "Times New Roman", serif;
  --f-mono: ui-monospace, "Cascadia Code", Consolas, "DejaVu Sans Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131516; --surface: #1b1e1f; --ink: #eceeee; --ink-2: #b4b9ba; --ink-3: #868c8e;
    --rule: #2d3233; --tint: #222828; --brand: #1fa88b; --brand-soft: #14302a; --alt: #2f7fd0;
    --alert: #e0584b; --alert-soft: #3a1f1c; --focus: #1fa88b;
    --pt-lo: #4b5153; --pt-hi: #eceeee; --plane: #7c8a89; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131516; --surface: #1b1e1f; --ink: #eceeee; --ink-2: #b4b9ba; --ink-3: #868c8e;
  --rule: #2d3233; --tint: #222828; --brand: #1fa88b; --brand-soft: #14302a; --alt: #2f7fd0;
  --alert: #e0584b; --alert-soft: #3a1f1c; --focus: #1fa88b;
  --pt-lo: #4b5153; --pt-hi: #eceeee; --plane: #7c8a89; color-scheme: dark;
}
.ctrls { display: flex; gap: 8px; align-items: center; }
.themebtn { appearance: none; border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2); border-radius: 8px; width: 34px; height: 33px; display: inline-grid; place-items: center; cursor: pointer; padding: 0; }
.themebtn:hover { color: var(--ink); border-color: var(--ink-3); }
.themebtn svg { width: 17px; height: 17px; display: block; }
.themebtn .moon { display: none; }
:root[data-theme="dark"] .themebtn .sun { display: none; }
:root[data-theme="dark"] .themebtn .moon { display: block; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .themebtn .sun { display: none; } :root:not([data-theme="light"]) .themebtn .moon { display: block; } }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 17px; line-height: 1.5; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 20px; padding-block: 24px 40px; }
.m { font-family: var(--f-math); font-style: italic; font-size: .95em; white-space: nowrap; }
.mu { font-family: var(--f-math); font-style: normal; font-size: .95em; white-space: nowrap; }
.m .up { font-style: normal; }
.hat { position: relative; display: inline-block; line-height: 1; }
.hat::after { content: "\02C6"; position: absolute; left: 50%; top: -.2em; transform: translateX(-30%); font-style: normal; font-size: 1em; line-height: 1; }
.tr { font-family: var(--f-ui); font-style: normal; font-weight: 400; font-size: .7em; position: relative; top: -.6em; margin-left: .05em; line-height: 0; }
.bar { position: relative; display: inline-block; line-height: 1; }
.bar::after { content: ""; position: absolute; left: 12%; right: 0; top: -.05em; border-top: 1.2px solid currentColor; }

header { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 20px; margin-bottom: 18px; align-items: start; }
.kicker { font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 0; }
h1 { font-family: var(--f-display); font-weight: 600; font-size: clamp(26px, 3.6vw, 38px); line-height: 1.15; margin: 0; text-wrap: balance; }
.thesis { margin: 6px 0 0; max-width: 80ch; color: var(--ink-2); grid-column: 1 / -1; }
.lang { grid-column: 2; grid-row: 1 / span 2; justify-self: end; }
@media (max-width: 560px) { header { grid-template-columns: minmax(0, 1fr); } .lang { grid-column: 1; grid-row: auto; justify-self: start; } }

.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg button { appearance: none; border: 0; background: transparent; color: var(--ink-2); font: inherit; font-size: 15px; padding: 5px 12px; cursor: pointer; font-variant-numeric: tabular-nums; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--tint); color: var(--ink); font-weight: 700; }
.btn { appearance: none; font: inherit; font-size: 15px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 5px 13px; cursor: pointer; font-variant-numeric: tabular-nums; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); font-weight: 700; }
.btn:disabled { opacity: .45; cursor: default; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; }
.sec-title { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 0; font-weight: 700; }
.check { display: inline-flex; gap: 7px; align-items: center; font-size: 15.5px; color: var(--ink-2); cursor: pointer; }
.check input { accent-color: var(--ink); width: 16px; height: 16px; margin: 0; }

/* výběr části a proměnné */
.chooser { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px 24px; align-items: center; margin-bottom: 16px; }
@media (max-width: 760px) { .chooser { grid-template-columns: minmax(0, 1fr); } }
.parts { display: inline-flex; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: var(--surface); }
.parts button { appearance: none; border: 0; background: transparent; font: inherit; color: var(--ink-2); padding: 9px 16px; cursor: pointer; text-align: left; display: grid; gap: 0; }
.parts button + button { border-left: 1px solid var(--rule); }
.parts button b { color: var(--ink); font-size: 16px; }
.parts button small { font-size: 13.5px; color: var(--ink-3); }
.parts button[aria-pressed="true"] { background: var(--brand-soft); box-shadow: inset 0 -3px 0 var(--brand); }
.vars { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.vars .lbl { font-size: 15px; color: var(--ink-3); margin-right: 2px; }
.xvars { grid-column: 2; }
.xvars[hidden] { display: none; }
@media (max-width: 760px) { .xvars { grid-column: 1; } }
.vbtn { appearance: none; font: inherit; border: 1px solid var(--rule); background: var(--surface); border-radius: 8px; padding: 5px 12px; cursor: pointer; display: grid; text-align: left; line-height: 1.25; }
.vbtn b { font-size: 15.5px; color: var(--ink); font-weight: 700; }
.vbtn small { font-size: 13px; color: var(--ink-3); }
.vbtn[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); }

.pop { padding: 14px 16px 10px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 260px); gap: 8px 20px; margin-bottom: 20px; }
@media (max-width: 760px) { .pop { grid-template-columns: minmax(0, 1fr); } }
.pop .head { grid-column: 1 / -1; }
.pop canvas { width: 100%; height: 150px; display: block; }
.pop .stats { font-size: 15px; color: var(--ink-2); display: grid; gap: 3px; align-content: start; font-variant-numeric: tabular-nums; }
.pop .stats p { margin: 0; }

.grid { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 960px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.sim { padding: 12px 14px 10px; display: grid; gap: 8px; min-width: 0; }
.sim canvas { width: 100%; display: block; }
.status { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; font-size: 15px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.status b { color: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 14px; color: var(--ink-2); }
.legend .item { display: inline-flex; align-items: center; gap: 7px; }
.sw { width: 22px; height: 0; border-top: 2.5px solid var(--brand); }
.sw.dash { border-top: 2px dashed var(--ink); }
.sw.alt { border-top: 2.5px solid var(--alt); }
.sw.dot { width: 9px; height: 9px; border: 0; border-radius: 50%; background: var(--brand); }

.side { display: grid; gap: 20px; min-width: 0; }
.ctrl { padding: 14px 16px; display: grid; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row .lab { font-size: 15px; color: var(--ink-2); min-width: 96px; }
.se { padding: 14px 16px; display: grid; gap: 10px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
td, th { padding: 5px 4px; border-bottom: 1px solid var(--rule); font-size: 14.5px; text-align: right; vertical-align: baseline; }
th { font-size: 12.5px; color: var(--ink-3); font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }
td:first-child, th:first-child { text-align: left; }
td.hl { color: var(--brand); font-weight: 700; }
.se p { margin: 0; font-size: 14.5px; color: var(--ink-2); }

.notes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; margin-top: 20px; }
@media (max-width: 900px) { .notes { grid-template-columns: minmax(0, 1fr); } }
.notes .panel { padding: 18px 20px; min-width: 0; }
.notes h2 { font-family: var(--f-display); font-weight: 600; font-size: 21px; margin: 0 0 8px; }
.notes ol { margin: 0; padding-left: 1.3em; display: grid; gap: 8px; color: var(--ink-2); }
.code-wrap { position: relative; }
pre { margin: 0; background: var(--tint); border-radius: 8px; padding: 12px 14px; overflow-x: auto; font-family: var(--f-mono); font-size: 13.5px; line-height: 1.55; color: var(--ink); }
pre .c { color: var(--ink-3); }
.copy { position: absolute; top: 8px; right: 8px; font-size: 13.5px; padding: 3px 10px; }
footer { margin-top: 18px; font-size: 13.5px; color: var(--ink-3); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

  function sdB1(k, n) { const r = reg(k); if (st.x === "height") return r.su / (r.sx * Math.sqrt(n - 3)); return r.su * Math.sqrt(binMoments(n, S.degree.mean).invSST); } // výšky: E[1/SST_x] = 1/(σ_x²(n − 3))
  function sdB0(k, n) { const r = reg(k); if (st.x === "height") return r.su * Math.sqrt(1 / n + r.mx ** 2 / ((n - 3) * r.sx ** 2)); return r.su * Math.sqrt(binMoments(n, S.degree.mean).invN0); }
  const cloud = [], cloudJ = []; for (let i = 0; i < 2500; i++) { cloud.push(Math.floor(rng() * N)); cloudJ.push(rng() - 0.5); }

  // ================= stav a simulace =================
  const st = { part: "A", v: "weight", x: "height", n: 100, std: false, cmp: false, norm: true };

  const ri = () => Math.floor(Math.random() * N);
  function drawSample(withData) { // jeden výběr s vracením
    const n = st.n, y = P[st.v], x = P[st.x];
    if (st.part === "A") {
      let s = 0, s2 = 0; const idx = withData ? new Int32Array(n) : null;
      for (let i = 0; i < n; i++) { const j = ri(); if (idx) idx[i] = j; const v = y[j]; s += v; s2 += v * v; }
      const m = s / n, sd = Math.sqrt(Math.max(0, (s2 - n * m * m) / (n - 1)));
      return { est: m, s: sd, idx };
    }
    for (;;) {
      let sx = 0, sy = 0; const idx = new Int32Array(n);
      for (let i = 0; i < n; i++) { const j = ri(); idx[i] = j; sx += x[j]; sy += y[j]; }
      const mx = sx / n, my = sy / n; let sxy = 0, sxx = 0;
      for (let i = 0; i < n; i++) { const j = idx[i]; sxy += (x[j] - mx) * (y[j] - my); sxx += (x[j] - mx) ** 2; }
      if (sxx < 1e-12) continue; // všichni mají stejné x → regresi nelze spočítat, losujeme znovu
      const b1 = sxy / sxx, b0 = my - b1 * mx; let ssr = 0;
      for (let i = 0; i < n; i++) { const j = idx[i]; ssr += (y[j] - b0 - b1 * x[j]) ** 2; }
      const sig = Math.sqrt(ssr / (n - 2));
      return { b0, b1, se1: sig / Math.sqrt(sxx), idx: withData ? idx : null };
    }
  }
  function addOne(withData) {
    const r = drawSample(withData);
    if (st.part === "A") sim.est.push(r.est); else { sim.b0.push(r.b0); sim.b1.push(r.b1); sim.lines.push([r.b0, r.b1]); if (sim.lines.length > 30) sim.lines.shift(); }
    sim.jit.push(Math.random());

    return r;
  }

    st.n = keepN; cmpCache[key] = out; return out;

    line(rg.b0, rg.b1, C.ink, 1.6, [6, 4], 1);
    ctx.restore();
    ctx.font = `700 13px ${F.ui}`; const hd = last && last.idx ? L().sampleLbl(st.n) : L().popLbl; label(ctx, hd, x0, 12, C.ink2, `700 13px ${F.ui}`);
    const hw = ctx.measureText(hd).width; if (W >= 520) label(ctx, "  ·  " + varName(k), x0 + hw, 12, C.ink3, `13px ${F.ui}`);
    if (last && last.idx) { const w = betaHat(ctx, "1", x1 - 100, 20, C.brand, 15, "left"); label(ctx, " = " + f(last.b1, bin ? 2 : 3), x1 - 100 + w, 20, C.brand, `15px ${F.m}`); }

    // --- dolní: β̂1, β̂0 a sdružené rozdělení
    const stdm = st.std, cmp = st.cmp, cd = cmp ? cmpData() : null, nRef = st.n === 5 ? 5 : 10;
    const s1 = sdB1(k, st.n), s0 = sdB0(k, st.n), s1w = sdB1(k, nRef), s0w = sdB0(k, nRef);
    const z1 = (v, n) => stdm ? (v - rg.b1) / sdB1(k, n) : v, z0 = (v, n) => stdm ? (v - rg.b0) / sdB0(k, n) : v;
    const d1 = stdm ? [-4.5, 4.5] : [rg.b1 - 4 * s1w, rg.b1 + 4 * s1w], d0 = stdm ? [-4.5, 4.5] : [rg.b0 - 4 * s0w, rg.b0 + 4 * s0w];
    const yTop = topH + gapT, pw = narrow ? (W - 24) : (W - 24 - 2 * 28) / 3;
    const slots = [0, 1, 2].map(i => narrow ? { x0: 12, x1: W - 12, top: yTop + i * (rowH + 52), bot: yTop + i * (rowH + 52) + rowH } : { x0: 12 + i * (pw + 28), x1: 12 + i * (pw + 28) + pw, top: yTop, bot: yTop + rowH });
    const panels = [{ arr: sim.b1, z: z1, dom: d1, true_: rg.b1, sd: s1, sub: "1", cmpKey: "a", sdF: (n) => sdB1(k, n) }, { arr: sim.b0, z: z0, dom: d0, true_: rg.b0, sd: s0, sub: "0", cmpKey: "b", sdF: (n) => sdB0(k, n) }];
    const R = sim.b1.length, inAnim = anim && p < 1 && anim.kind === "one";
    panels.forEach((pn, i) => {
      const s = slots[i], sxp = axis(ctx, s.x0, s.x1, s.bot, pn.dom[0], pn.dom[1], narrow ? 6 : 4, null);
      const tx = betaHat(ctx, pn.sub, s.x0, s.top - 10, C.ink2, 15, "left"); if (stdm) label(ctx, L().stdz, s.x0 + tx, s.top - 10, C.ink3, `12.5px ${F.ui}`);
      vline(ctx, sxp(stdm ? 0 : pn.true_), s.top, s.bot, C.ink, [4, 3], 1.3);
      ctx.save(); ctx.beginPath(); ctx.rect(s.x0, s.top - 6, s.x1 - s.x0, s.bot - s.top + 6); ctx.clip();
      if (cmp) {
        const styles = { 10: [C.ink3, [2, 3]], 100: [C.alt, [7, 4]], 1000: [C.brand, true] }; let ymax = 0; const bwF = (n) => stdm ? 0.3 : pn.sdF(n) / 3;
        const arrs = {}; [10, 100, 1000].forEach(n => { arrs[n] = Array.from(cd[n][pn.cmpKey], v => pn.z(v, n)); const Hh = hist(arrs[n], pn.dom[0], pn.dom[1], bwF(n)); Hh.c.forEach(c => ymax = Math.max(ymax, c / (arrs[n].length * bwF(n)))); });
        if (stdm) ymax = Math.max(ymax, pdf(0)); ymax *= 1.1;
        [10, 100, 1000].forEach(n => drawHistPanel(ctx, arrs[n], pn.dom[0], pn.dom[1], bwF(n), sxp, s.top, s.bot, styles[n][0], null, styles[n][1], ymax));
        if (stdm && st.norm) drawHistPanel(ctx, [], pn.dom[0], pn.dom[1], 1, sxp, s.top, s.bot, C.alt, pdf, true, ymax);
        ctx.restore(); return;
      }
      const vals = pn.arr.map(v => pn.z(v, st.n)), shown = inAnim ? vals.slice(0, -1) : vals;
      const normFn = st.norm ? (stdm ? pdf : (v) => pdf((v - pn.true_) / pn.sd) / pn.sd) : null;
      const rr = R <= 30 ? 4.5 : R <= 1000 ? 2.6 : 1.5, al = R <= 30 ? 0.75 : R <= 1000 ? 0.4 : 0.15, bandH = Math.max(10, rr * 5) + rr + 6;
      if (shown.length >= 2) drawHistPanel(ctx, shown, pn.dom[0], pn.dom[1], stdm ? 0.25 : pn.sd / 3, sxp, s.top, s.bot - bandH, C.ink3, normFn, false, 0, 0.45);
      else if (normFn && R > 0) drawHistPanel(ctx, [], pn.dom[0], pn.dom[1], 1, sxp, s.top, s.bot - bandH, C.ink3, normFn, false, 0);
      bandDots(ctx, shown, sim.jit, sxp, s.bot, rr, C.brand, al, inAnim ? -1 : R - 1);
      if (inAnim && p > 0.6) { const band = Math.max(10, rr * 5), a2 = Math.min(1, (p - 0.6) / 0.3); ctx.globalAlpha = a2; ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(sxp(vals[R - 1]), s.bot - rr - 2 - sim.jit[R - 1] * band, rr + 1.5, 0, 2 * Math.PI); ctx.fill(); ctx.globalAlpha = 1; }
      ctx.restore();
    });
    // sdružené rozdělení: osa x = β̂1, osa y = β̂0
    const s3 = slots[2], jx = stdm ? d1 : [rg.b1 - 4 * s1, rg.b1 + 4 * s1], jy = stdm ? d0 : [rg.b0 - 4 * s0, rg.b0 + 4 * s0];
    const sxj = axis(ctx, s3.x0 + 34, s3.x1, s3.bot, jx[0], jx[1], narrow ? 6 : 4, null), syj = (v) => s3.bot - (v - jy[0]) / (jy[1] - jy[0]) * (s3.bot - s3.top);
    { const t = ticks(jy[0], jy[1], 4); ctx.font = `11.5px ${F.ui}`; ctx.fillStyle = C.ink3; ctx.textAlign = "right"; ctx.textBaseline = "middle"; t.o.forEach(v => ctx.fillText(f(v, t.s < 1 ? 1 : 0), s3.x0 + 30, syj(v))); }
    rich(ctx, L().jointHead, s3.x0, s3.top - 10, C.ink2, 15);
    betaHat(ctx, "1", s3.x1, s3.bot + 34, C.ink2, 14, "right");
    ctx.save(); ctx.beginPath(); ctx.rect(s3.x0 + 34, s3.top, s3.x1 - s3.x0 - 34, s3.bot - s3.top); ctx.clip();
    let A = sim.b1, Bv = sim.b0, nn = st.n; if (cmp) { nn = cd[st.n] ? st.n : 10; A = cd[nn].a; Bv = cd[nn].b; }
    const nP = A.length, rr = nP > 2000 ? 1.1 : nP > 200 ? 1.8 : 3; ctx.fillStyle = C.brand; ctx.globalAlpha = nP > 2000 ? 0.28 : 0.6;
    for (let i = 0; i < nP; i++) ctx.fillRect(sxj(z1(A[i], nn)) - rr, syj(z0(Bv[i], nn)) - rr, 2 * rr, 2 * rr);
    ctx.globalAlpha = 1; ctx.restore();
    const cx = sxj(stdm ? 0 : rg.b1), cy = syj(stdm ? 0 : rg.b0); ctx.strokeStyle = C.ink; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx - 6, cy); ctx.lineTo(cx + 6, cy); ctx.moveTo(cx, cy - 6); ctx.lineTo(cx, cy + 6); ctx.stroke();
  }

  // ---------- postranní panel ----------
  const meanArr = (a) => a.reduce((s, v) => s + v, 0) / a.length;
  const sdArr = (a) => { const m_ = meanArr(a); return Math.sqrt(a.reduce((s, v) => s + (v - m_) ** 2, 0) / (a.length - 1)); };
  function updateSide() {
    const k = st.v, A = st.part === "A", arr = A ? sim.est : sim.b1, R = arr.length, last = sim.last;
    $("stLeft").innerHTML = st.cmp ? L().cmpStatus.replace("n", "<i>n</i>") : L().status(fi(R)).replace("R = ", "<i>R</i> = ");
    $("stRight").innerHTML = `<span class="m">n</span> = ${fi(st.n)}`;
    const d = A ? 2 : (st.x === "degree" ? 2 : 3), truth = A ? S[k].mean : reg(k).b1, sdT = A ? sdMean(k, st.n) : sdB1(k, st.n);
    const one = last ? (A ? [last.est, last.s / Math.sqrt(st.n)] : [last.b1, last.se1]) : [NaN, NaN];
    const rows = L().rows[A ? "A" : "B"], dash = "–";
    const se1 = A ? '<span class="m">s / √n</span>' : '<span class="m">se(<span class="hat">β</span>₁)</span>';
    $("seBody").innerHTML =
      `<tr><td>${rows[0]}</td><td>${R ? f(meanArr(arr), d) : dash}</td><td>${f(truth, d)}<br><small class="m">${A ? "μ" : "β₁"}</small></td><td class="hl">${f(one[0], d)}<br><small class="m">${A ? '<span class="bar">x</span>' : '<span class="hat">β</span>₁'}</small></td></tr>` +
      `<tr><td>${rows[1]}</td><td>${R > 1 ? f(sdArr(arr), d + 1) : dash}<br><small>sd</small></td><td>${f(sdT, d + 1)}<br><small class="m">${A ? "σ / √n" : st.x === "height" ? "σ<sub>u</sub> / (σ<sub>x</sub>√(n − 3))" : "σ<sub>u</sub>√<span class=\"up\">E</span>[1 / <span class=\"up\">SST</span><sub>x</sub>]"}</small></td><td class="hl">${f(one[1], d + 1)}<br><small>${se1}</small></td></tr>`;
    $("seNote").innerHTML = A ? L().seNoteA : (L().seNoteB + " " + (st.x === "height" ? L().seNoteBh : L().seNoteBd));
    upright($("seBody")); upright($("seNote"));
  }

  function legend() {
    const A = st.part === "A";
    const it = (cls, txt) => `<span class="item"><span class="sw ${cls}"></span><span>${txt}</span></span>`;
    let h = it("dash", A ? (lang === "cs" ? 'populační průměr <span class="m">μ</span>' : 'population mean <span class="m">μ</span>') : (lang === "cs" ? "populační přímka" : "population line"));
    h += it("", A ? (lang === "cs" ? 'průměr výběru <span class="m"><span class="bar">x</span></span>' : 'sample mean <span class="m"><span class="bar">x</span></span>') : (lang === "cs" ? "odhadnutá přímka a odhady" : "estimated line and estimates"));
    if (st.norm) h += it("alt", lang === "cs" ? "normální rozdělení se stejnou střední hodnotou a rozptylem" : "normal distribution with the same mean and variance");
    $("legend").innerHTML = h;
  }

  // ================= ovládání =================
  let raf = 0, playing = null;
  function frame() { drawSim(); if (anim && performance.now() - anim.t0 < anim.dur) raf = requestAnimationFrame(frame); else { anim = null; raf = 0; drawSim(); } }
  function stepOne(slow) { addOne(true); if (reduce) { anim = null; drawSim(); return; } anim = { t0: performance.now(), dur: (st.part === "A" ? 1100 : 900) * (slow || 1), kind: "one" }; cancelAnimationFrame(raf); raf = requestAnimationFrame(frame); }
  function jumpTo(target, frames) { // doplní výběry v dávkách, aby bylo vidět „plnění“ histogramu
    return new Promise(res => { const tick = () => { const R0 = sim.R; if (R0 >= target) { res(); return; } const batch = Math.max(1, Math.ceil((target - R0) / (reduce ? 1 : (frames || 12)))); for (let i = 0; i < Math.min(batch, target - R0) - 1; i++) addOne(false); addOne(true); anim = null; drawSim(); requestAnimationFrame(tick); }; tick(); });
  }
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  async function play() {
    if (playing) { playing.stop = true; return; }
    const tok = { stop: false }; playing = tok; $("play").innerHTML = L().stop; st.cmp = false; $("optCmp").checked = false;
    resetSim(); drawSim();
    // přehrávání je pomalejší než ruční ovládání: prvních 10 výběrů poloviční rychlostí, dávky čtvrtinovou
    for (let i = 0; i < 10 && !tok.stop; i++) { stepOne(2); await sleep(reduce ? 300 : 2700); }
    for (const t of [100, 1000, 10000]) { if (tok.stop) break; await sleep(reduce ? 300 : 2400); if (tok.stop) break; await jumpTo(t, 48); }
    playing = null; $("play").innerHTML = L().play;
  }
  function stopPlay() { if (playing) { playing.stop = true; playing = null; $("play").innerHTML = L().play; } }

  function setPart(p) { stopPlay(); st.part = p; ["A", "B"].forEach(q => $("part" + q).setAttribute("aria-pressed", String(q === p))); resetSim(); applyTexts(); drawPop(); drawSim(); }
  $("partA").addEventListener("click", () => setPart("A")); $("partB").addEventListener("click", () => setPart("B"));
  ["weight", "wage", "sport"].forEach(v => $("v-" + v).addEventListener("click", () => { stopPlay(); st.v = v; ["weight", "wage", "sport"].forEach(q => $("v-" + q).setAttribute("aria-pressed", String(q === v))); resetSim(); drawPop(); drawSim(); }));
  ["height", "degree"].forEach(v => $("x-" + v).addEventListener("click", () => { stopPlay(); st.x = v; ["height", "degree"].forEach(q => $("x-" + q).setAttribute("aria-pressed", String(q === v))); resetSim(); applyTexts(); drawPop(); drawSim(); }));
  $("nSeg").querySelectorAll("button").forEach(b => b.addEventListener("click", () => { stopPlay(); st.n = +b.dataset.n; $("nSeg").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); resetSim(); drawSim(); }));
  $("play").addEventListener("click", play);
  $("one").addEventListener("click", () => { stopPlay(); if (st.cmp) { st.cmp = false; $("optCmp").checked = false; } stepOne(); });
  $("reset").addEventListener("click", () => { stopPlay(); resetSim(); drawSim(); });
  let jumping = false; // kliknutí během doplňování se přičte k cíli
  let jumpTarget = 0;
  document.querySelectorAll("[data-by]").forEach(b => b.addEventListener("click", async () => { stopPlay(); if (st.cmp) { st.cmp = false; $("optCmp").checked = false; }
    jumpTarget = (jumping ? jumpTarget : sim.R) + +b.dataset.by; if (jumping) return; jumping = true;
    try { while (sim.R < jumpTarget) await jumpTo(jumpTarget); } finally { jumping = false; } }));
  $("optNorm").addEventListener("change", (e) => { st.norm = e.target.checked; legend(); drawSim(); });
  $("optStd").addEventListener("change", (e) => { st.std = e.target.checked; drawSim(); });
  $("optCmp").addEventListener("change", (e) => { stopPlay(); st.cmp = e.target.checked; drawSim(); });
  $("copy").addEventListener("click", async () => { const btn = $("copy"); try { await navigator.clipboard.writeText($("code").innerText); btn.textContent = L().copied; } catch (e) { const s = window.getSelection(), r = document.createRange(); r.selectNodeContents($("code")); s.removeAllRanges(); s.addRange(r); btn.textContent = L().selected; } setTimeout(() => btn.textContent = L().copy, 2200); });

  function applyTexts() {
    $("optStdL").innerHTML = st.part === "A" ? L().optStdA : L().optStdB;
    $("xVars").hidden = st.part === "A"; $("varLbl").innerHTML = st.part === "A" ? L().varLbl : L().yLbl;
    $("notesList").innerHTML = (st.part === "A" ? L().notesA : L().notesB).map(t => `<li>${t}</li>`).join("");
    legend(); upright(document.body);
  }
  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i]").forEach(e => { const v = L()[e.dataset.i]; if (typeof v === "string") e.innerHTML = v; });
    if (playing) $("play").innerHTML = L().stop;
    $("code").innerHTML = L().code.replace(/<(?!\/?span)/g, "&lt;");
    ["en", "cs"].forEach(l => $("lang-" + l).setAttribute("aria-pressed", String(l === lang)));
    applyTexts(); drawPop(); drawSim();
  }
  ["en", "cs"].forEach(l => $("lang-" + l).addEventListener("click", () => { lang = l; try { localStorage.setItem("econviz-lang", l); } catch (e) {} applyLang(); }));
  const redraw = () => { readColors(); drawPop(); drawSim(); };
  if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", redraw);
  new MutationObserver(redraw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  let rt = 0; new ResizeObserver(() => { clearTimeout(rt); rt = setTimeout(redraw, 80); }).observe(document.querySelector(".wrap"));

  resetSim(); readColors(); applyLang();
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(redraw);
})();
